<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaira – traces of what matters</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="img/icon.png">
  <script>
    (function () {
      var have = ['de', 'en', 'fr', 'it', 'es', 'pt-BR', 'zh-Hans', 'ja'];
      var prefs = navigator.languages || [navigator.language || 'en'];
      for (var i = 0; i < prefs.length; i++) {
        var p = prefs[i].toLowerCase();
        for (var j = 0; j < have.length; j++) {
          var h = have[j].toLowerCase();
          if (p === h || p.split('-')[0] === h.split('-')[0]) { location.replace('index_' + have[j] + '.html'); return; }
        }
      }
      location.replace('index_en.html');
    })();
  </script>
</head>
<body class="chooser">
  <main><h1 class="brand">Kaira</h1><ul class="chooser-list"><li><a href="index_de.html" hreflang="de">Deutsch</a></li><li><a href="index_en.html" hreflang="en">English</a></li><li><a href="index_fr.html" hreflang="fr">Français</a></li><li><a href="index_it.html" hreflang="it">Italiano</a></li><li><a href="index_es.html" hreflang="es">Español</a></li><li><a href="index_pt-BR.html" hreflang="pt-BR">Português</a></li><li><a href="index_zh-Hans.html" hreflang="zh-Hans">简体中文</a></li><li><a href="index_ja.html" hreflang="ja">日本語</a></li></ul></main>
</body>
</html>
